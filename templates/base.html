<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APScheduler WebUI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Scheduler</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Jobs</a></li>
                    <li class="nav-item"><a class="nav-link" href="/store">Store</a></li>
                    <li class="nav-item"><a class="nav-link" href="/executor">Executor</a></li>
                    <li class="nav-item"><a class="nav-link" href="/log/jobs">Logs</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container" id="main-content">
        <!-- Content will be injected here by Jinja2 -->
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS (needed for Modals) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
